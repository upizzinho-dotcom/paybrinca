
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayBrinca</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#202b3c}
header{background:#1769e0;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:27px}
header p{margin:6px 0 0;opacity:.85}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:white;padding:12px;box-shadow:0 2px 8px #0001}
nav button{border:0;background:#edf3fc;color:#24518c;padding:11px 15px;border-radius:9px;cursor:pointer;font-weight:bold}
nav button.active{background:#1769e0;color:white}
main{max-width:850px;margin:22px auto;padding:0 14px}
.panel{display:none;background:white;padding:20px;border-radius:15px;box-shadow:0 3px 14px #0000000d}
.panel.active{display:block}
h2{margin-top:0}
input,textarea{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #d5deeb;border-radius:9px;font-size:15px}
button.primary{background:#1769e0;color:white;border:0;padding:12px 17px;border-radius:9px;cursor:pointer;font-weight:bold}
button.danger{background:#ffe9e9;color:#bd2929;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}
button.secondary{background:#edf3fc;color:#24518c;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}
.item{border:1px solid #e5eaf2;border-radius:11px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.item p{margin:5px 0;color:#64748b}
.price{font-weight:bold;color:#1769e0}
.small{font-size:13px;color:#718096}
.total{font-size:21px;font-weight:bold;margin:18px 0}
.empty{text-align:center;color:#718096;padding:25px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
footer{text-align:center;color:#8793a5;font-size:12px;padding:22px}
</style>
</head>
<body>

<header>
<h1>PayBrinca</h1>
<p>A tua carteira digital</p>
</header>

<nav>
<button class="active" onclick="abrir('pagar',this)">Pagar</button>
<button onclick="abrir('loja',this)">Loja</button>
<button onclick="abrir('carrinho',this)">Carrinho</button>
<button onclick="abrir('historico',this)">Histórico</button>
<button onclick="abrir('itens',this)">Itens</button>
</nav>

<main>

<section id="pagar" class="panel active">
<h2>Enviar pagamento</h2>
<label>Nome do destinatário</label>
<input id="destinatario" placeholder="Ex.: João">
<label>Descrição</label>
<input id="descricao" placeholder="Ex.: Almoço">
<label>Valor (€)</label>
<input id="valor" type="number" min="0.01" step="0.01" placeholder="0,00">
<button class="primary" onclick="pagar()">Confirmar pagamento</button>
</section>

<section id="loja" class="panel">
<h2>Loja</h2>
<div id="listaLoja"></div>
</section>

<section id="carrinho" class="panel">
<h2>O meu carrinho</h2>
<div id="listaCarrinho"></div>
<div class="total" id="totalCarrinho">Total: 0,00 €</div>
<button class="primary" onclick="finalizarCompra()">Finalizar compra</button>
</section>

<section id="historico" class="panel">
<h2>Histórico</h2>
<div id="listaHistorico"></div>
</section>

<section id="itens" class="panel">
<h2>Adicionar produto</h2>
<label>Nome do produto</label>
<input id="nomeProduto" placeholder="Ex.: T-shirt">
<label>Preço unitário (€)</label>
<input id="precoProduto" type="number" min="0.01" step="0.01" placeholder="0,00">
<label>Quantidade em stock</label>
<input id="stockProduto" type="number" min="0" step="1" placeholder="Ex.: 10">
<button class="primary" onclick="adicionarProduto()">Adicionar produto</button>
<h2 style="margin-top:28px">Os meus produtos</h2>
<div id="listaItens"></div>
</section>

</main>

<footer>PayBrinca · Aplicação independente, sem ligação a bancos ou serviços de pagamento.</footer>

<script>
const guardar = (chave, dados) => localStorage.setItem(chave, JSON.stringify(dados));
const ler = (chave, padrao) => {
  try {
    const dados = JSON.parse(localStorage.getItem(chave));
    return dados ?? padrao;
  } catch {
    return padrao;
  }
};

let produtos = ler("pb_produtos", []);
let carrinho = ler("pb_carrinho", []);
let historico = ler("pb_historico", []);

function idNovo(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}

function euros(valor){
  return Number(valor).toLocaleString("pt-PT", {
    style:"currency", currency:"EUR"
  });
}

function guardarTudo(){
  guardar("pb_produtos", produtos);
  guardar("pb_carrinho", carrinho);
  guardar("pb_historico", historico);
}

function abrir(id, botao){
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  if(botao) botao.classList.add("active");

  atualizar();
}

function registarHistorico(tipo, nome, valor, referencia){
  historico.unshift({
    id:idNovo(),
    tipo,
    nome,
    valor:Number(valor),
    referencia,
    data:new Date().toLocaleString("pt-PT")
  });
  guardarTudo();
}

function pagar(){
  const nome = document.getElementById("destinatario").value.trim();
  const descricao = document.getElementById("descricao").value.trim() || "Pagamento";
  const valor = Number(document.getElementById("valor").value);

  if(!nome || !Number.isFinite(valor) || valor <= 0){
    alert("Preenche o destinatário e um valor válido.");
    return;
  }

  const referencia = "PB" + Math.random().toString(36).slice(2,10).toUpperCase();

  registarHistorico("Pagamento", nome + " · " + descricao, valor, referencia);

  alert("Pagamento simulado com sucesso!\nNenhum dinheiro foi transferido.\nReferência: " + referencia);

  document.getElementById("destinatario").value = "";
  document.getElementById("descricao").value = "";
  document.getElementById("valor").value = "";
  atualizar();
}

function adicionarProduto(){
  const nome = document.getElementById("nomeProduto").value.trim();
  const preco = Number(document.getElementById("precoProduto").value);
  const stock = Number(document.getElementById("stockProduto").value);

  if(!nome || !Number.isFinite(preco) || preco <= 0 ||
     !Number.isInteger(stock) || stock < 0){
    alert("Preenche corretamente o nome, o preço e a quantidade.");
    return;
  }

  produtos.push({id:idNovo(), nome, preco, stock});
  guardarTudo();

  document.getElementById("nomeProduto").value = "";
  document.getElementById("precoProduto").value = "";
  document.getElementById("stockProduto").value = "";

  atualizar();
}

function adicionarCarrinho(id){
  const produto = produtos.find(p => p.id === id);
  if(!produto || produto.stock <= 0){
    alert("Produto sem stock.");
    return;
  }

  const linha = carrinho.find(c => c.produtoId === id);
  const quantidadeAtual = linha ? linha.quantidade : 0;

  if(quantidadeAtual >= produto.stock){
    alert("Não há mais unidades disponíveis.");
    return;
  }

  if(linha) linha.quantidade++;
  else carrinho.push({produtoId:id, quantidade:1});

  guardarTudo();
  atualizar();
  alert("Produto adicionado ao carrinho!");
}

function alterarQuantidade(id, diferenca){
  const linha = carrinho.find(c => c.produtoId === id);
  const produto = produtos.find(p => p.id === id);
  if(!linha || !produto) return;

  const nova = linha.quantidade + diferenca;

  if(nova <= 0){
    carrinho = carrinho.filter(c => c.produtoId !== id);
  } else if(nova <= produto.stock){
    linha.quantidade = nova;
  } else {
    alert("Não há stock suficiente.");
  }

  guardarTudo();
  atualizar();
}

function removerCarrinho(id){
  carrinho = carrinho.filter(c => c.produtoId !== id);
  guardarTudo();
  atualizar();
}

function total(){
  return carrinho.reduce((soma, linha) => {
    const p = produtos.find(x => x.id === linha.produtoId);
    return soma + (p ? p.preco * linha.quantidade : 0);
  }, 0);
}

function finalizarCompra(){
  if(carrinho.length === 0){
    alert("O carrinho está vazio.");
    return;
  }

  for(const linha of carrinho){
    const produto = produtos.find(p => p.id === linha.produtoId);
    if(!produto || produto.stock < linha.quantidade){
      alert("Um dos produtos já não tem stock suficiente.");
      return;
    }
  }

  const valor = total();
  const resumo = carrinho.map(linha => {
    const p = produtos.find(x => x.id === linha.produtoId);
    return p.nome + " x" + linha.quantidade;
  }).join(", ");

  carrinho.forEach(linha => {
    const p = produtos.find(x => x.id === linha.produtoId);
    p.stock -= linha.quantidade;
  });

  const referencia = "PB" + Math.random().toString(36).slice(2,10).toUpperCase();
  registarHistorico("Compra", resumo, valor, referencia);

  carrinho = [];
  guardarTudo();

  alert("Compra simulada concluída!\nNenhum dinheiro foi transferido.\nTotal: " + euros(valor) + "\nReferência: " + referencia);

  atualizar();
  abrir("historico", document.querySelectorAll("nav button")[3]);
}

function apagarHistorico(id){
  if(!confirm("Queres apagar este registo?")) return;
  historico = historico.filter(h => h.id !== id);
  guardarTudo();
  atualizar();
}

function apagarProduto(id){
  if(!confirm("Queres apagar este produto?")) return;
  produtos = produtos.filter(p => p.id !== id);
  carrinho = carrinho.filter(c => c.produtoId !== id);
  guardarTudo();
  atualizar();
}

function atualizar(){
  const loja = document.getElementById("listaLoja");
  const itens = document.getElementById("listaItens");
  const listaCarrinho = document.getElementById("listaCarrinho");
  const listaHistorico = document.getElementById("listaHistorico");

  loja.replaceChildren();
  itens.replaceChildren();
  listaCarrinho.replaceChildren();
  listaHistorico.replaceChildren();

  if(produtos.length === 0){
    loja.innerHTML = '<p class="empty">Ainda não existem produtos na loja.</p>';
    itens.innerHTML = '<p class="empty">Ainda não adicionaste produtos.</p>';
  }

  produtos.forEach(p => {
    const div = document.createElement("div");
    div.className = "item";

    const info = document.createElement("div");
    const nome = document.createElement("strong");
    nome.textContent = p.nome;
    const detalhe = document.createElement("p");
    detalhe.textContent = euros(p.preco) + " · Stock: " + p.stock;
    info.append(nome, detalhe);

    const btn = document.createElement("button");
    btn.className = "primary";
    btn.textContent = "Adicionar ao carrinho";
    btn.disabled = p.stock <= 0;
    btn.onclick = () => adicionarCarrinho(p.id);

    div.append(info, btn);
    loja.append(div);

    const divItem = document.createElement("div");
    divItem.className = "item";

    const infoItem = document.createElement("div");
    const nomeItem = document.createElement("strong");
    nomeItem.textContent = p.nome;
    const detalheItem = document.createElement("p");
    detalheItem.textContent = euros(p.preco) + " · Stock: " + p.stock;
    infoItem.append(nomeItem, detalheItem);

    const apagar = document.createElement("button");
    apagar.className = "danger";
    apagar.textContent = "Apagar";
    apagar.onclick = () => apagarProduto(p.id);

    divItem.append(infoItem, apagar);
    itens.append(divItem);
  });

  if(carrinho.length === 0){
    listaCarrinho.innerHTML = '<p class="empty">O teu carrinho está vazio.</p>';
  }

  carrinho.forEach(linha => {
    const p = produtos.find(x => x.id === linha.produtoId);
    if(!p) return;

    const div = document.createElement("div");
    div.className = "item";

    const info = document.createElement("div");
    const nome = document.createElement("strong");
    nome.textContent = p.nome;
    const detalhe = document.createElement("p");
    detalhe.textContent = euros(p.preco) + " cada · Subtotal: " + euros(p.preco * linha.quantidade);
    info.append(nome, detalhe);

    const acoes = document.createElement("div");
    acoes.className = "actions";

    const menos = document.createElement("button");
    menos.className = "secondary";
    menos.textContent = "−";
    menos.onclick = () => alterarQuantidade(p.id, -1);

    const qtd = document.createElement("span");
    qtd.textContent = linha.quantidade;
    qtd.style.padding = "9px";

    const mais = document.createElement("button");
    mais.className = "secondary";
    mais.textContent = "+";
    mais.onclick = () => alterarQuantidade(p.id, 1);

    const remover = document.createElement("button");
    remover.className = "danger";
    remover.textContent = "Remover";
    remover.onclick = () => removerCarrinho(p.id);

    acoes.append(menos, qtd, mais, remover);
    div.append(info, acoes);
    listaCarrinho.append(div);
  });

  document.getElementById("totalCarrinho").textContent = "Total: " + euros(total());

  if(historico.length === 0){
    listaHistorico.innerHTML = '<p class="empty">Ainda não existem movimentos.</p>';
  }

  historico.forEach(h => {
    const div = document.createElement("div");
    div.className = "item";

    const info = document.createElement("div");
    const titulo = document.createElement("strong");
    titulo.textContent = h.tipo + " · " + h.nome;

    const detalhe = document.createElement("p");
    detalhe.textContent = h.data + " · Referência: " + h.referencia;

    const valor = document.createElement("div");
    valor.className = "price";
    valor.textContent = euros(h.valor);

    info.append(titulo, detalhe);

    const apagar = document.createElement("button");
    apagar.className = "danger";
    apagar.textContent = "Apagar";
    apagar.onclick = () => apagarHistorico(h.id);

    const lado = document.createElement("div");
    lado.append(valor, apagar);
    lado.style.display = "flex";
    lado.style.flexDirection = "column";
    lado.style.gap = "8px";

    div.append(info, lado);
    listaHistorico.append(div);
  });
}

atualizar();
</script>
</body>
</html>
